[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-backend"
version = "0.1.0"
description = "HTTP API for Orbit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1,<3",
    "supabase==2.33.0",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The local Supabase CLI directory must not change SDK import classification.
known-third-party = ["supabase"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=orbit_backend --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["orbit_backend"]
